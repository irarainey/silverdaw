allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  # vue-demi ships a postinstall that picks Vue 2 vs Vue 3 by rewriting its
  # own files. We don't need it (we use Vue 3 directly), and pnpm 11 errors
  # on any unlisted ignored build, so deny it explicitly.
  vue-demi: false

# Use a hoisted (flat) node_modules layout instead of pnpm's default
# isolated/symlinked layout. electron-builder traverses node_modules at
# packaging time to copy production deps into the asar; its resolver
# does not follow pnpm's `.pnpm/<pkg>@<version>/node_modules/<pkg>`
# symlink topology correctly, so transitive deps (e.g. `ieee754` under
# `music-metadata`) get silently skipped and the packaged app crashes
# at launch with "Cannot find package 'ieee754'". Hoisted mode produces
# an npm-compatible flat tree that electron-builder packs verbatim.
# As of pnpm 10+, this setting lives here rather than in `.npmrc`.
nodeLinker: hoisted

# Security overrides for transitive dependencies that upstream packages pin
# below their patched versions, so a plain `pnpm update` cannot reach them.
# Each entry exists solely to clear a published advisory; the dependent that
# forces the old version is named alongside it. Drop an entry once its
# dependent has released a version that resolves the fix on its own.
#
# As of pnpm 10+, overrides live here rather than under `pnpm` in package.json.
overrides:
  # node-gyp pins undici ^6 — patched in 6.28.0. The v7 line reaches 7.29.0
  # unaided, so scope this to major 6 and leave v7 to normal resolution.
  undici@6: ^6.28.0
  # app-builder-lib / builder-util / dmg-builder pin js-yaml 4.1.1.
  js-yaml: ^4.3.1
  # electron-publish pins form-data 4.0.5.
  form-data: ^4.0.6
  # app-builder-lib and node-gyp pin tar 7.5.15.
  tar: ^7.5.18
  # tmp-promise pins tmp 0.2.5.
  tmp: ^0.2.6
  # Two independent minimatch majors pull vulnerable brace-expansion lines:
  # minimatch@5 -> brace-expansion@2, minimatch@10 -> brace-expansion@5.
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.7

